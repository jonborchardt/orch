name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:check
      - name: Schema and committed migrations must agree
        shell: bash
        run: |
          npx drizzle-kit generate --name ci-drift
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "src/storage/schema.ts has changes without a committed migration (run npm run db:generate)"
            git status --porcelain -- drizzle
            exit 1
          fi
      - run: npm run test:coverage
      - run: npm run build
      - run: node dist/cli/main.js --version
      - run: node dist/cli/main.js doctor
      - name: Dashboard browser checks (Playwright, Linux only)
        if: runner.os == 'Linux'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: CLI initializes the database from dist outside the repository
        shell: bash
        run: |
          export ORCH_HOME="$RUNNER_TEMP/orch-home"
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/dist/cli/main.js" --json job list
          test -f "$ORCH_HOME/orch.sqlite"

  # Temporary measurement: how many Vitest workers the 2-core runners can use profitably.
  measure:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, workers: 2 }
          - { os: windows-latest, workers: 3 }
          - { os: ubuntu-latest, workers: 2 }
          - { os: ubuntu-latest, workers: 3 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node -e "console.log('availableParallelism', require('node:os').availableParallelism())"
      - run: npx vitest run --maxWorkers=${{ matrix.workers }} ${{ runner.os == 'Linux' && '--coverage' || '' }}
