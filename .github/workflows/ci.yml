name: CI

on:
  push:
    branches: [main]
  pull_request:

# Linux takes 3 Vitest workers profitably; Windows is saturated by its default (tests spawn Git
# and Node constantly), so the Windows suite is split across runners instead with Vitest's own
# --shard, which spreads the files by path hash. Every test file runs in exactly one shard and no
# file is named here (decision 2026-11-23-ci-windows-vitest-shards). Change the shard count in the
# matrix, the job name, and the run step together.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run db:check
      - name: Schema and committed migrations must agree
        run: |
          npx drizzle-kit generate --name ci-drift
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            echo "src/storage/schema.ts has changes without a committed migration (run npm run db:generate)"
            git status --porcelain -- drizzle
            exit 1
          fi
      - run: npm run test:coverage -- --maxWorkers=3
      - run: npm run build
      - run: node dist/cli/main.js --version
      - run: node dist/cli/main.js doctor
      - name: Dashboard browser checks (Playwright)
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: CLI initializes the database from dist outside the repository
        run: |
          export ORCH_HOME="$RUNNER_TEMP/orch-home"
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/dist/cli/main.js" --json job list
          test -f "$ORCH_HOME/orch.sqlite"

  windows:
    name: windows (${{ matrix.shard }}/6)
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run --shard=${{ matrix.shard }}/6
      - name: Built CLI runs on Windows and initializes a database outside the repository
        if: matrix.shard == 3
        shell: bash
        run: |
          npm run build
          node dist/cli/main.js --version
          node dist/cli/main.js doctor
          export ORCH_HOME="$RUNNER_TEMP/orch-home"
          cd "$RUNNER_TEMP"
          node "$GITHUB_WORKSPACE/dist/cli/main.js" --json job list
          test -f "$ORCH_HOME/orch.sqlite"
